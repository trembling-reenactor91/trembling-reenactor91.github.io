name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A7DF17: ${{ secrets.A7DF17 }}
          BF07C7: ${{ secrets.BF07C7 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A7DF17', '')
          bm = os.environ.get('BF07C7', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 474ef256873053e8cbf1ad6931e141fc8dba -->', gm)
          if bm:
              s2 = s2.replace('<!-- 24e289d76ed719d64ee3a3b2c0e0a0b882 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
